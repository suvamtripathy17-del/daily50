<!DOCTYPE html>
<html lang="en">
<head>

<title>The Daily 50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: calm, exact, briefing-room — a reader who has 20 minutes and wants numbers.
   IDEA: an engineering datasheet for the world — one strip header, then dense, ruled entries.
   PICTURE: the day's mix of 50 stories as one full-width segmented bar, with counts.
   COLOUR and TYPE: cobalt title strip, white page, black ink, pale cobalt zones; Space Grotesk 600 + Inter.
   LAYOUT: strip, mix bar, section links, then sections of ruled entries (2 columns on wide screens). */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0a0d18);--ink:light-dark(#0b0d12,#e9ecf5);--mute:light-dark(#4a5162,#a3aac0);
--rule:light-dark(#dfe4f2,#232a40);--zone:light-dark(#eef2ff,#121a33);--cobalt:light-dark(#1240e0,#5b7dff);
--strip:#1240e0;--stripink:#fff;--chip:light-dark(#eef2ff,#16203d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:clip}
a{color:var(--cobalt)}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(5vw,16px)}
.strip{background:var(--strip);color:var(--stripink)}
.strip .wrap{padding-block:clamp(22px,3.5vw,44px)}
.strip h1{font:600 clamp(32px,6vw,52px)/1.05 "Space Grotesk",Inter,sans-serif;margin:0 0 8px;text-wrap:balance}
.strip p{margin:0;opacity:.92;max-width:70ch}
.dateline{font:500 16px/1.4 "Space Grotesk",Inter,sans-serif;margin-bottom:6px;opacity:.95}
.mix{padding-block:22px 6px}
.bar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--zone)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding:0;list-style:none;font-size:14px;color:var(--mute)}
.legend li{display:flex;align-items:center;gap:7px;white-space:nowrap}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
nav.scroll{display:flex;gap:8px;overflow-x:auto;padding:12px max(5vw,16px);border-block:1px solid var(--rule);background:var(--bg)}
nav.scroll a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:500;min-height:44px;display:flex;align-items:center}
nav.scroll a:focus-visible,a:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
@media(min-width:900px){nav.scroll{position:sticky;top:0;z-index:5;justify-content:center}}
section{padding-block:26px 8px}
section>h2{font:600 clamp(24px,3vw,32px)/1.1 "Space Grotesk",Inter,sans-serif;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
section>h2 small{font:500 15px/1 Inter,sans-serif;color:var(--mute)}
.list{display:grid;grid-template-columns:minmax(0,1fr);column-gap:48px}
@media(min-width:1100px){.list{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
article{padding:18px 0 20px;border-top:1px solid var(--rule)}
article h3{font:600 19px/1.3 "Space Grotesk",Inter,sans-serif;margin:0 0 8px;text-wrap:balance;display:flex;gap:10px}
article h3 .n{color:var(--cobalt);flex:none;min-width:1.6em}
article p{margin:0 0 10px;max-width:70ch}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:0;list-style:none}
.metrics li{background:var(--zone);border-radius:6px;padding:4px 9px;font-size:14px;font-variant-numeric:tabular-nums}
.why{background:var(--zone);border-radius:8px;padding:10px 12px;font-size:15px;margin:0 0 10px}
.why b{color:var(--cobalt)}
.src{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}
.src a{overflow-wrap:anywhere}
footer{padding-block:28px 40px;color:var(--mute);font-size:14px;border-top:1px solid var(--rule);margin-top:20px}
@media(prefers-reduced-motion:no-preference){.bar span{animation:grow .7s ease-out both}@keyframes grow{from{transform:scaleX(0);transform-origin:left}}}
</style>
</head>

<script id="edition" type="application/json">{"date": "Thursday, 26 November 2026 · Evening update", "short": "26 Nov 2026 (Evening)", "lede": "Iran claimed more mine strikes in Hormuz and Russia pounded Ukraine's grid while Wall Street took Thanksgiving off. Washington's tariff plan put India at up to 25%, or 17% with a deal, and Delhi rejected the 'excess capacity' charge; IT stocks lifted the Sensex 0.5% and Europe rallied on tariff caps. Fifty fresh events since the morning edition, with the numbers and what each means for business.", "note": "Evening update compiled Thu 26 Nov 2026, about 8:30 PM IST, as a second edition for the day; the morning edition's 50 stories are not repeated except where there was material news (India's tariff rate, the Ebola count, AI credit stress). US markets were closed for Thanksgiving. The Stoxx 600 figure is intraday (10:20 GMT), not a close; DAX, FTSE and CAC closes, Thursday's FII/DII flows and the rupee close were not found in today's sources. Still pending at publication: World Chess Championship Game 3 (match level 1-1), the Germany v Great Britain doubles and Austria v Spain at the Davis Cup, and tonight's Europa League. Several tech items come from daily AI digests (DEV Community, KillTheAI, Rio Rundown) that cite other outlets, and benchmark claims are self-reported by the companies.", "order": ["Tech", "Markets & Finance", "Geopolitics", "India", "Business", "Energy", "Climate & Health", "Sports"], "footer": "The Daily 50 · Evening update of 26 Nov 2026 · Summaries written from the linked reports; check the sources before quoting a number. Next edition: Friday about 9 AM IST.", "items": [{"cat": "Tech", "title": "OpenAI to put ChatGPT and Codex on one shared usage meter from December", "brief": "OpenAI will pool usage for Plus, Pro and Business subscribers into a single token-based allowance shared across ChatGPT and its Codex coding agent from December, with Instant chats kept outside the meter. The rollout has started with a small group of Pro users. A spokesperson told TechCrunch most people should see no change in how often limits reset, but the heaviest users may hit caps sooner. Chat and coding work will now draw on one budget.", "metrics": ["Plus, Pro, Business", "From December", "Instant chats exempt"], "why": "Token-based metering across products ties price to compute cost; companies should expect AI tools to be budgeted by usage rather than flat per-seat fees.", "src": [{"t": "DEV Community: AI Daily Digest, 26 Nov", "u": "https://dev.to/hiroki-ii-ai/ai-daily-digest-november-26-2026-one-meter-for-chatgpt-and-codex-cognition-doubles-down-europe-2j0o"}, {"t": "Rio Rundown: AI news, 26 Nov", "u": "https://riorundown.substack.com/p/ai-news-nov-26-2026-agentic-ai-infrastructure"}]}, {"cat": "Tech", "title": "Cognition's SWE-2.1 roughly doubles Devin's coding scores, built on a Chinese open-weight model", "brief": "Cognition released SWE-2.1, the model behind its Devin coding agent, on 24 November. Its self-reported scores roughly double the previous generation: Terminal-Bench 4.1 rose from 24.2 to 50.0, ProgramBench from 17.0 to 44.0 and ExploitBench from 36.1% to 80%. It was trained with reinforcement learning on Moonshot AI's open-weight Kimi K3 (2.8 trillion parameters). A 'Lightning' version on Cerebras runs at about 600 tokens a second, against 60 for the standard build.", "metrics": ["Terminal-Bench 24.2→50.0", "ExploitBench 80%", "~600 tok/s on Cerebras", "Base: Kimi K3, 2.8T"], "why": "A US agent company building on a Chinese open model shows open weights are now competitive foundations, which complicates export-control and vendor-risk policies.", "src": [{"t": "DEV Community: AI Daily Digest, 26 Nov", "u": "https://dev.to/hiroki-ii-ai/ai-daily-digest-november-26-2026-one-meter-for-chatgpt-and-codex-cognition-doubles-down-europe-2j0o"}]}, {"cat": "Tech", "title": "Japan's Sakana AI launches a 30B reasoning model that beats one four times its size", "brief": "Sakana AI announced Namazu Small on 25 November, a 30-billion-parameter reasoning model built on Nvidia's open Nemotron 3 Nano base. On Sakana's 25-benchmark average it beats Nvidia's 120B Nemotron 3 Super, scoring 73.5 against 36.1 on the BrowseComp web-research test, though it is weaker on factual recall (SimpleQA Verified 6.8 vs 18.1). On-premises packaging ships in the first half of December, price undisclosed. Japan's GENIAC programme, run by METI and NEDO, supported the work.", "metrics": ["30B parameters", "BrowseComp 73.5 vs 36.1", "On-prem from December"], "why": "Small, on-premises models backed by national programmes give governments and regulated firms a sovereign alternative to US cloud AI, a template for India's own AI mission.", "src": [{"t": "DEV Community: AI Daily Digest, 26 Nov", "u": "https://dev.to/hiroki-ii-ai/ai-daily-digest-november-26-2026-one-meter-for-chatgpt-and-codex-cognition-doubles-down-europe-2j0o"}]}, {"cat": "Tech", "title": "A 27B model squeezed into 5.9 GB: PrismML's ternary Bonsai runs on phones and Macs", "brief": "PrismML released Ternary Bonsai 2.5 27B, in which every weight is −1, 0 or +1, shrinking the model to 5.9 GB from about 54 GB at 16-bit precision. Based on Qwen3.8 27B, it runs on Nvidia and Intel GPUs, Macs, iPhones and iPads. It scores 75.6 on SWE-bench Verified, up from 60.8 for the previous version but below 80.6 for the full-precision model, and 90.5 on AppWorld, up from 51.2. Weights are released under the Apache 2.0 licence.", "metrics": ["5.9 GB vs ~54 GB", "SWE-bench 75.6", "Apache 2.0"], "why": "Extreme compression moves capable AI onto devices, cutting cloud inference bills and easing data-privacy concerns for enterprise and consumer apps.", "src": [{"t": "KillTheAI: Top AI news, 26 Nov", "u": "https://killtheai.com/news/top-10-ai-news-today-november-26-2026/"}]}, {"cat": "Tech", "title": "OpenAI tests 'Private Inference' so enterprises can send sensitive data to its models", "brief": "OpenAI is running an alpha of Private Inference with a small group of enterprise customers. Prompts and responses are processed inside attested confidential-computing environments, and OpenAI says flagged content is encrypted and stored in the customer's own cloud account. The service is part of a wider 'Private Intelligence' stack. OpenAI has not said which models support it or when it will be generally available.", "metrics": ["Alpha, select enterprises", "Confidential computing", "Flagged data in customer cloud"], "why": "Hardware-attested privacy tackles the main objection banks, hospitals and governments have to frontier models, opening regulated-industry budgets.", "src": [{"t": "KillTheAI: Top AI news, 26 Nov", "u": "https://killtheai.com/news/top-10-ai-news-today-november-26-2026/"}]}, {"cat": "Tech", "title": "Anthropic study: AI's value is more output, and two-thirds of firms are hiring less", "brief": "Anthropic interviewed 66 people at 58 enterprise customers and catalogued nearly 300 AI deployments. Most value came from higher output rather than cost cuts. Two-thirds of the companies said they were hiring less because of AI, nine had cut contractors, many of them offshore, and two said AI had fully eliminated a position. Anthropic cautions the sample is not representative because all 58 companies are its own customers.", "metrics": ["58 firms, 66 interviews", "~300 deployments", "2/3 hiring less", "9 cut contractors"], "why": "Cuts to offshore contractors are a direct signal for India's IT-services and BPO industry, where AI is starting to substitute for outsourced work.", "src": [{"t": "KillTheAI: Top AI news, 26 Nov", "u": "https://killtheai.com/news/top-10-ai-news-today-november-26-2026/"}]}, {"cat": "Tech", "title": "EU proposes a €50 billion sovereign tech fund and a 'buy European' quantum law", "brief": "EU tech chief Henna Virkkunen presented a €50 billion Sovereign Tech Equity Fund on 25 November, aiming to attract up to €6 of private money per public euro, with a draft Quantum Act requiring public quantum contracts to favour EU-controlled firms. In 2025 the EU spent €8.6 billion of public money on quantum, against €5.3 billion in the US and €13.6 billion in China, but EU quantum start-ups raised only €1.1 billion privately versus €7 billion in the US. Member states and Parliament must still agree.", "metrics": ["€50B fund", "Up to 1:6 private leverage", "EU quantum €8.6B vs China €13.6B"], "why": "Europe is tilting procurement toward local champions, which could limit market access for US and Indian tech vendors in strategic technologies.", "src": [{"t": "DEV Community: AI Daily Digest, 26 Nov", "u": "https://dev.to/hiroki-ii-ai/ai-daily-digest-november-26-2026-one-meter-for-chatgpt-and-codex-cognition-doubles-down-europe-2j0o"}]}, {"cat": "Tech", "title": "AI credit stress: default-swap spreads hit records for Oracle, Alphabet, SpaceX and CoreWeave", "brief": "Credit default swap spreads, the cost of insuring against default, hit record highs over the past two sessions for Alphabet, Oracle, SpaceX and CoreWeave, TradingKey reports citing Motley Fool; CoreWeave's reached 1,314 basis points. Nvidia closed Wednesday at $149.30, having given back about 40% of Monday's record $39.52 gain after Jensen Huang's reinstatement. Huang is due to brief congressional committees privately on 1 December and testify to the Senate Banking Committee on 3 December.", "metrics": ["CoreWeave CDS 1,314 bp", "NVDA $149.30", "Senate testimony 3 Dec"], "why": "If lenders treat AI buyers as riskier, financing for GPU purchases tightens, which could slow chip orders and data-centre build-outs worldwide.", "src": [{"t": "TradingKey: Nvidia gives back 40% of rally", "u": "https://www.tradingkey.com/analysis/stocks/us-stocks/262323489-nvidia-gives-back-40-percent-record-rally-credit-fears-159-17-falling-channel-november-26-2026-tradingkey"}]}, {"cat": "Tech", "title": "Dell's AI server backlog hits a record $132.3 billion", "brief": "Dell reported a record AI order backlog of $132.3 billion and raised its AI server revenue outlook to $78 billion, in results released after Tuesday's US close. The figures landed in the middle of a sharp sell-off in AI stocks, with the Nasdaq down 0.62% on Wednesday and Nvidia trading 91% above its three-month average volume. Dell builds servers around Nvidia accelerators for cloud providers, AI labs and enterprises, so its backlog is a direct read on hardware demand.", "metrics": ["Backlog $132.3B (record)", "AI server outlook $78B"], "why": "A record backlog shows firm orders behind the AI build-out even as valuations fall, supporting server supply chains across Asia.", "src": [{"t": "TradingKey: Nvidia gives back 40% of rally", "u": "https://www.tradingkey.com/analysis/stocks/us-stocks/262323489-nvidia-gives-back-40-percent-record-rally-credit-fears-159-17-falling-channel-november-26-2026-tradingkey"}]}, {"cat": "Tech", "title": "New York bans AI chatbot toys for five years", "brief": "Governor Kathy Hochul signed a law banning the manufacture, distribution and sale of toys with embedded AI chatbots in New York for five years, covering internet-connected stuffed animals, dolls and robots. The ban takes effect in 90 days, with civil penalties of up to $15,000 a day. New York is the second US state to act, after California. It comes just as the US holiday shopping season peaks with Black Friday on 27 November.", "metrics": ["5-year ban", "Effective in 90 days", "Fines up to $15,000/day"], "why": "Toy and consumer-electronics makers planning AI features now face a state-by-state patchwork in the US, raising compliance costs.", "src": [{"t": "KillTheAI: Top AI news, 26 Nov", "u": "https://killtheai.com/news/top-10-ai-news-today-november-26-2026/"}]}, {"cat": "Tech", "title": "Hex.pm breach: a decade-old flaw let attackers into the Elixir package registry", "brief": "A maximum-severity remote-code-execution flaw (CVE-2026-129514), present since 2016, let attackers compromise six production servers of Hex.pm, the package registry for Elixir and Erlang. Hex blocked the traffic and patched all servers within about 20 minutes. No modified packages were found, but email addresses, password hashes, API-key hashes and two-factor secrets may have been read. All users were logged out, and the package-signing key has not yet been replaced.", "metrics": ["CVE-2026-129514", "6 servers hit", "Patched in ~20 min"], "why": "Package registries are prime supply-chain targets; teams using Elixir should rotate keys and 2FA and watch for the signing-key change.", "src": [{"t": "KillTheAI: Top AI news, 26 Nov", "u": "https://killtheai.com/news/top-10-ai-news-today-november-26-2026/"}]}, {"cat": "Tech", "title": "'Inception' extortion gang hijacks Microsoft 365 accounts by phoning staff", "brief": "Unit 42 researchers say an extortion group they call Inception poses as IT support on the phone to steal credentials and session tokens, enrols its own MFA devices and then pulls data from Microsoft 365, SharePoint and OneDrive. They link it to Com-affiliated clusters including ShinyHunters. The group claims seven victims, including AMD, PepsiCo and Cigna, none confirmed, and ReversingLabs found 21 single-sign-on phishing domains.", "metrics": ["7 claimed victims (unconfirmed)", "21 phishing domains"], "why": "Voice phishing defeats ordinary MFA, so help-desk identity checks and phishing-resistant keys are now board-level controls.", "src": [{"t": "KillTheAI: Top AI news, 26 Nov", "u": "https://killtheai.com/news/top-10-ai-news-today-november-26-2026/"}]}, {"cat": "Tech", "title": "EA brings back late commentator John Motson as an AI voice in FC 27", "brief": "EA Sports added an optional commentary track in FC 27 that recreates the late John Motson's voice with AI, in Title Update 1.3.0 released on 26 November. It was built from almost ten years of his recordings plus an AI voice model. EA says his widow and son approved the project and were paid. The campaign group Save Our Voices Now questioned voice cloning when the person cannot give consent themselves.", "metrics": ["Update 1.3.0, 26 Nov", "~10 years of recordings", "Family approved and paid"], "why": "Licensed cloning of deceased talent is becoming a revenue line; estate consent and pay terms here will set precedents for media and advertising.", "src": [{"t": "KillTheAI: Top AI news, 26 Nov", "u": "https://killtheai.com/news/top-10-ai-news-today-november-26-2026/"}]}, {"cat": "Tech", "title": "Meta lets users steer Facebook and Reels feeds in plain language", "brief": "Meta published details on 24 November of 'Your Algorithm', which lets people tell Facebook Feed and Reels what they want, for example 'show me fewer celebrity gossip posts'. A large language model checks the request and extracts structured intent; four retrieval paths, using semantic embeddings, collaborative filtering, trending clusters and the social graph, feed layered filters; and a fine-tuned LLM reranker makes the final choice of posts shown.", "metrics": ["4 retrieval paths", "LLM reranker", "Published 24 Nov"], "why": "User-set preferences in plain words give Meta a transparency answer for regulators and change how advertisers and creators reach audiences.", "src": [{"t": "DEV Community: AI Daily Digest, 26 Nov", "u": "https://dev.to/hiroki-ii-ai/ai-daily-digest-november-26-2026-one-meter-for-chatgpt-and-codex-cognition-doubles-down-europe-2j0o"}]}, {"cat": "Tech", "title": "AMD shows AI-managed memory can swap three-quarters of server DRAM for flash", "brief": "AMD described MEXT, which predicts which memory pages will be needed and moves cold pages to flash despite a 500-fold latency gap. Replacing 75% of DRAM kept 85% to 88% of performance on agentic benchmarks and saved $4.9 million of DRAM across 145 servers, EE Times reports; it is aimed at data-centre and enterprise use. Separately, SemiAnalysis tests showed AMD's MI355X delivering 644 output tokens a second per user on agent workloads.", "metrics": ["75% DRAM replaced", "85–88% performance kept", "$4.9M saved, 145 servers"], "why": "Memory is a large share of AI server cost; cheaper memory tiers would lower capex for cloud and enterprise data centres.", "src": [{"t": "Rio Rundown: AI news, 26 Nov", "u": "https://riorundown.substack.com/p/ai-news-nov-26-2026-agentic-ai-infrastructure"}]}, {"cat": "Markets & Finance", "title": "IT rally lifts Sensex 390 points to 84,329; Nifty ends at 25,885", "brief": "The Sensex rose 390.31 points (0.46%) to 84,328.59 and the Nifty 65.25 points (0.25%) to 25,884.50 on Thursday, after paring early gains; the Nifty touched 25,974. Nifty IT jumped 3.66%, led by HCL Tech (+6.4%), TCS (+4.9%) and Infosys, and BSE Ltd gained 5.7%. Realty and metals rose, while FMCG, consumer durables and Bank Nifty (−0.26%) fell; Asian Paints and Bajaj Finance lost nearly 3%. India VIX fell 4.7% to 16.84.", "metrics": ["Sensex 84,328.59 (+0.46%)", "Nifty 25,884.50 (+0.25%)", "Nifty IT +3.66%", "India VIX 16.84"], "why": "Rotation into IT shows investors betting Indian services exporters can win AI-era deals, even as US tariff talk weighs on consumer and finance stocks.", "src": [{"t": "Kotak Neo: Closing Bell, 26 Nov", "u": "https://www.kotakneo.com/news/market-news/sensex-and-nifty-manage-to-close-higher-despite-paring-early-gains/"}, {"t": "Liquide: Share market today, 26 Nov", "u": "https://blog.liquide.life/share-market-today-nifty-gains-65-points-to-25-884-sensex-rises-390-points-as-it-and-realty-lead-market-gains/"}, {"t": "IndustryWired: Closing Bell, 26 Nov", "u": "https://industrywired.com/stocks/closing-bell-indian-stock-market-ends-higher-hcl-tech-bse-lead-nifty-gainers-12843466"}]}, {"cat": "Markets & Finance", "title": "European stocks rally 1.7% as Washington signals caps on new tariffs", "brief": "The Stoxx 600 was up 1.7% at 636.44 by 10:20 GMT on Thursday, recovering Wednesday's 1% fall, after the US Trade Representative said new tariffs would be capped at rates agreed in trade deals, such as the 15% US–EU rate. Banks rose 2.4% and tech nearly 2.5%. Babcock gained 6% after Britain signed an £8 billion submarine-facilities contract, and Siemens Energy rose 4.8% on a Venezuelan energy alliance. The index is up 7.5% this year.", "metrics": ["Stoxx 600 636.44 (+1.7%, intraday)", "Banks +2.4%", "Babcock +6%", "YTD +7.5%"], "why": "A cap at deal rates tells exporters everywhere, India included, that signing a trade agreement is the route to lower US duties.", "src": [{"t": "Reuters via Investing.com: European stocks rally", "u": "https://www.investing.com/news/economy-news/european-stocks-rally-as-tech-and-banks-rebound-tariff-fears-ease-5052228"}]}, {"cat": "Markets & Finance", "title": "Nikkei rises 0.84% as Kioxia jumps 12.6% and SoftBank 7.3%", "brief": "Japan's Nikkei 225 closed up 0.84% on Thursday, with real estate, banking and textiles leading. Memory-chip maker Kioxia soared 12.57% to ¥7,762 and SoftBank Group rose 7.32% to ¥2,894, while Sharp fell 3.16% to an all-time low of ¥459 and Japan Airlines lost 2.93%. Advancers beat decliners by 2,066 to 1,393 on the Tokyo exchange. The yen stayed weak at about 159.2 per dollar.", "metrics": ["Nikkei +0.84%", "Kioxia +12.57%", "SoftBank +7.32%", "USD/JPY 159.21"], "why": "A rebound in memory and AI names suggests investors still back the chip cycle despite this week's US tech sell-off.", "src": [{"t": "Investing.com: Nikkei 225 up 0.84%", "u": "https://www.investing.com/news/stock-market-news/japan-stocks-higher-at-close-of-trade-nikkei-225-up-084-5052126"}]}, {"cat": "Markets & Finance", "title": "ECB accounts show broad support for a hike; Spain's de Cos lined up to succeed Lagarde", "brief": "Accounts of the ECB's 28–29 October meeting, released Thursday, say 'a large number' of members could have backed a rate rise then and that inflation is likely to run higher than thought. Most policymakers have since signalled a 25 basis-point hike on 17 December, which Reuters calls all but a done deal, and investors expect more because oil and gas prices sit far above the ECB's baseline. EU leaders are backing Spain's Pablo Hernández de Cos to take over in early 2027.", "metrics": ["25 bp hike expected 17 Dec", "Next ECB chief: de Cos (2027)"], "why": "With the Fed and ECB both set to hike in December, global borrowing costs rise and pressure builds on emerging-market currencies and on the RBI.", "src": [{"t": "Reuters via WTAQ: ECB accounts show hike support", "u": "https://wtaq.com/2026/11/26/ecb-already-had-large-support-for-rate-hike-in-oct-accounts-show/"}, {"t": "Euronews: EU summit live", "u": "https://www.euronews.com/2026/11/26/eu-summit-leaders-ready-to-spar-over-new-budget-and-ukraine-aid"}]}, {"cat": "Markets & Finance", "title": "Gold and silver bounce; MCX silver jumps 3.2%", "brief": "Precious metals recovered on Thursday after gold's slide below $3,500 earlier in the week. December gold futures rose 0.85% to $3,566 an ounce in Asian trade. In India, MCX December gold rose 1% to ₹1,22,350 per 10 grams and MCX December silver jumped 3.23% to ₹1,47,124 a kilo. Trading was thinner than usual with US markets closed for Thanksgiving, and the dollar index held near 103.7.", "metrics": ["Gold fut. $3,566 (+0.85%)", "MCX gold ₹1,22,350 (+1%)", "MCX silver ₹1,47,124 (+3.23%)"], "why": "Bullion swings move Indian jewellers' inventory costs, gold-loan collateral values and household wealth, much of which is held in gold.", "src": [{"t": "Kotak Neo: Closing Bell, 26 Nov", "u": "https://www.kotakneo.com/news/market-news/sensex-and-nifty-manage-to-close-higher-despite-paring-early-gains/"}, {"t": "Investing.com: Nikkei 225 up 0.84%", "u": "https://www.investing.com/news/stock-market-news/japan-stocks-higher-at-close-of-trade-nikkei-225-up-084-5052126"}]}, {"cat": "Markets & Finance", "title": "Foreigners have bought $15 billion of Indian shares in November; margin-funding book hits ₹1.5 lakh crore", "brief": "Foreign portfolio investors have bought about $15.16 billion of Indian equities in November as of 26 November, Equentis reports citing Reuters. Kotak Neo says the market's margin trading facility book has grown to about ₹1.5 lakh crore from ₹28,200 crore in April 2022. Among Thursday's movers, Coforge fell over 5% on reports Advent International may sell up to 10%, Action Construction Equipment jumped about 8% and InCred Holdings cut its IPO fresh issue to ₹750 crore from ₹1,250 crore.", "metrics": ["FPI Nov ~$15.16B", "MTF book ~₹1.5 lakh cr", "Coforge −5%", "ACE +8%"], "why": "Big foreign inflows support the rupee and valuations, but a five-fold rise in leveraged retail buying raises the risk of sharper sell-offs.", "src": [{"t": "Equentis: Stock market today, 26 Nov", "u": "https://www.equentis.com/blog/stock-market-today-sensex-gains-200-points-nifty-falls-below-25800-nifty-it-rises-2/"}, {"t": "Kotak Neo: Closing Bell, 26 Nov", "u": "https://www.kotakneo.com/news/market-news/sensex-and-nifty-manage-to-close-higher-despite-paring-early-gains/"}]}, {"cat": "Geopolitics", "title": "US tariff plan rewards deals: Vietnam faces up to 35%, 20% if it signs", "brief": "Details of the US Section 301 proposal show rates tied to trade deals. Vietnam faces up to 35%, falling to 20% with an agreement; Thailand and Bangladesh face 18%; and the USTR said rates would be capped at levels agreed in completed or pending deals, such as 15% for the EU. Washington cites subsidies and surplus capacity in pharmaceuticals, medical devices, steel, solar and ICT. Public comments run to 5 January 2027 and hearings start on 25 January.", "metrics": ["Vietnam 35% → 20% with deal", "Thailand, Bangladesh 18%", "Comments to 5 Jan", "Hearings 25 Jan"], "why": "The gap between deal and no-deal rates will push Asian exporters to concede market access and reshape where global brands source goods.", "src": [{"t": "ThePrint: India 'takes note' of US tariffs", "u": "https://theprint.in/diplomacy/india-takes-note-of-us-new-proposed-tariffs-says-it-has-no-excess-capacity-in-any-sector/3109418/"}, {"t": "NEXT IAS: Proposed US tariffs on India", "u": "https://www.nextias.com/ca/current-affairs/26-11-2026/proposed-us-tariffs-on-india"}, {"t": "Reuters via Investing.com: European stocks rally", "u": "https://www.investing.com/news/economy-news/european-stocks-rally-as-tech-and-banks-rebound-tariff-fears-ease-5052228"}]}, {"cat": "Geopolitics", "title": "Iran claims more tankers and an LNG carrier hit mines in Hormuz; traffic all but stopped", "brief": "Iran's Revolutionary Guards said an LNG carrier caught fire and exploded after hitting a mine in the Strait of Hormuz while using what Iran called an unauthorised US-Israeli route. They had claimed two tankers struck mines on Wednesday and three earlier in the week. No maritime authority has confirmed the strikes. IMF PortWatch recorded one transit on 22 November against a pre-crisis norm of 85 a day. US Treasury Secretary Bessent said Iran has no oil on the water to sell.", "metrics": ["1 transit vs 85/day norm", "6 claimed mine hits this week", "Unverified by authorities"], "why": "Even unconfirmed mine claims lift war-risk premiums and keep Gulf energy and shipping routes to India costly and unreliable.", "src": [{"t": "Oilprice.com: Iran says LNG carrier hit mine", "u": "https://oilprice.com/Latest-Energy-News/World-News/Iran-Says-LNG-Carrier-Exploded-After-Hitting-a-Mine-in-Hormuz.html"}, {"t": "Straits Daily Brief, 26 Nov", "u": "https://straits.live/briefs/2026-11-26"}, {"t": "Reuters via Business Recorder: Oil prices fall", "u": "https://www.brecorder.com/news/40450825/oil-prices-fall-as-supply-concerns-linger-after-iran-claims-mine-strikes-on-ships"}]}, {"cat": "Geopolitics", "title": "Russia fires missiles and 113 drones at Ukraine; Kyiv mall hit, grain ships attacked", "brief": "Russia launched Iskander-M, Zircon and S-400 missiles plus 113 drones overnight into Thursday; Ukraine says 87 drones were stopped, with hits at 20 locations. A married couple died when a drone struck a 16-storey block in Kharkiv, and a ballistic strike in Kyiv's Desnianskyi district injured seven and damaged a shopping centre. Russia also attacked two foreign civilian ships off Odesa carrying more than 100,000 tonnes of grain. Ukraine received 250 bodies and Russia 22 in a repatriation.", "metrics": ["113 drones, 87 downed", "20 impact sites", "2 grain ships, 100,000+ t"], "why": "Attacks on grain ships threaten Black Sea food exports and raise freight and insurance costs for importers in Asia and Africa.", "src": [{"t": "Euronews: Russian missile and drone barrage", "u": "https://www.euronews.com/2026/11/26/russia-launches-ballistic-missile-and-drone-barrage-on-ukraine-killing-at-least-three"}, {"t": "Ukraine Daily, 26 Nov", "u": "https://thechrissampson.substack.com/p/ukraine-daily-november-26-2026-kyiv"}, {"t": "LB.ua: Overnight Russian strikes", "u": "https://en.lb.ua/news/2026/11/26/51574_overnight_russian_strikes_hit.html"}]}, {"cat": "Geopolitics", "title": "Kushner promises the war's largest prisoner swap 'before the holidays'; US clears $621M F-16 support", "brief": "Jared Kushner, speaking on Axel Springer chief Mathias Döpfner's podcast, said trilateral talks are set to produce 'the largest prisoner exchange of the war' very soon, before the holidays. Donald Trump met NATO Secretary-General Mark Rutte at Mar-a-Lago on Wednesday; their joint statement said Russia should avoid widening the war. The State Department approved a possible sale of F-16 sustainment services to Ukraine worth more than $621 million, paid for by Belgium, Denmark, the Netherlands and Norway.", "metrics": ["F-16 support $621M+", "Paid by 4 NATO allies", "Swap promised pre-holidays"], "why": "Progress on prisoner exchanges and steady allied funding shape the odds of a ceasefire, and with them European energy prices and defence budgets.", "src": [{"t": "Ukraine desk note, 26 Nov", "u": "https://oskarhallgrimsson.substack.com/p/ukraine-desk-note-26-november-2026"}]}, {"cat": "Geopolitics", "title": "EU summit opens with a fight over a €1.7 trillion budget and a €45 billion Ukraine loan", "brief": "EU leaders gathered in Brussels on Thursday to debate European Council President António Costa's proposal for a seven-year budget worth almost €1.7 trillion and a Commission plan for a €45 billion loan to Ukraine financed by joint EU borrowing. Euronews reports Slovakia, the Czech Republic and Hungary want to opt out of the loan, while Bulgaria says it is ready to join. Leaders are also backing Spain's Pablo Hernández de Cos to head the ECB.", "metrics": ["Budget ~€1.7T over 7 years", "Ukraine loan €45B", "3 states seek opt-out"], "why": "More joint EU debt deepens the euro bond market and funds defence and reconstruction contracts across Europe.", "src": [{"t": "Euronews: EU summit live", "u": "https://www.euronews.com/2026/11/26/eu-summit-leaders-ready-to-spar-over-new-budget-and-ukraine-aid"}, {"t": "Euronews: Russian missile and drone barrage", "u": "https://www.euronews.com/2026/11/26/russia-launches-ballistic-missile-and-drone-barrage-on-ukraine-killing-at-least-three"}]}, {"cat": "India", "title": "US proposes up to 25% tariff on India, 17% with a deal; Delhi says it has 'no excess capacity'", "brief": "The USTR's Section 301 proposal would put up to 25% on Indian goods, falling to 17% if India signs a trade agreement; smartphones, pharmaceuticals, semiconductors, metals, vehicles and aircraft parts are exempt. The Commerce Ministry said it 'has taken note', has no structural excess capacity in any sector and wants issues settled in bilateral trade talks. Delhi's Chamber of Trade and Industry urged 25% retaliatory tariffs, warning 500,000 jobs and over $48 billion of exports are at risk.", "metrics": ["Up to 25% / 17% with deal", "FY26 exports to US $87.31B", "500,000 jobs at risk (CTI)"], "why": "India's rate is below Vietnam's, a relative edge, but the 8-point gap is strong pressure to close the trade deal on US terms, especially for textiles, leather and gems.", "src": [{"t": "ThePrint: India 'takes note' of US tariffs", "u": "https://theprint.in/diplomacy/india-takes-note-of-us-new-proposed-tariffs-says-it-has-no-excess-capacity-in-any-sector/3109418/"}, {"t": "The Week: India rejects excess-capacity claims", "u": "https://www.theweek.in/news/biz-tech/2026/11/26/tariff-india-rejects-us-excess-capacity-allegations.html"}, {"t": "CNA via KhanList: Trade body urges retaliation", "u": "https://khanlist.com/story/indian-trade-body-urges-retaliatory-tariffs-on-us-goods-6bfd4a8a"}, {"t": "NEXT IAS: Proposed US tariffs on India", "u": "https://www.nextias.com/ca/current-affairs/26-11-2026/proposed-us-tariffs-on-india"}]}, {"cat": "India", "title": "RBI paper: inflation hit 6.1% in October and is spreading; markets expect a December hike", "brief": "An RBI staff paper released Wednesday says headline CPI inflation rose to 6.1% in October from 5.5% in September and that price rises are broadening: 11 of 12 divisions rose month on month, led by food, and 11 states had inflation above 6%. Restaurants and food ran above 6%, clothing and transport at 4–6%. Activity stayed resilient on strong credit demand. Most market watchers expect another 25 basis-point repo hike at the 4 December policy review.", "metrics": ["CPI 6.1% (Oct)", "11 of 12 divisions up", "Repo hike expected 4 Dec"], "why": "Broad-based inflation means RBI is likely to keep tightening, raising borrowing costs for companies and home buyers into 2027.", "src": [{"t": "Business Standard: RBI paper on inflation", "u": "https://www.business-standard.com/economy/news/inflation-more-generalised-more-categories-seeing-price-hikes-rbi-paper-126112600055_1.html"}]}, {"cat": "India", "title": "Record October exports of $49.5 billion, up 45%; GST collections jump 23%", "brief": "The RBI's November bulletin shows merchandise exports hit a record $49.5 billion in October, up 45.1% year on year, while imports rose 16.5% to $89.4 billion, narrowing the trade deficit to $39.9 billion from $42.6 billion. Gross GST revenue grew 22.9%, the second-highest monthly collection since July 2017. Bank credit grew 19.5% and deposits 16.9% as of 31 October. The RBI bought a net $6.94 billion of foreign currency in September.", "metrics": ["Exports $49.5B (+45.1%)", "Trade deficit $39.9B", "GST +22.9%", "Credit +19.5%"], "why": "Strong exports and credit support the Q2 GDP release due 30 November, but credit growth this fast also feeds the inflation RBI is fighting.", "src": [{"t": "Shoonya: RBI November bulletin", "u": "https://shoonya.com/blog/what-the-rbis-november-bulletin-says-about-indias-economy/"}, {"t": "CrackTarget: Current affairs, 26 Nov", "u": "https://cracktarget.com/current-affairs-26-november-2026/"}]}, {"cat": "India", "title": "Forex reserves climb to $737.8 billion, but net FDI turns negative", "brief": "RBI's half-yearly report shows foreign-exchange reserves rose from $691.11 billion to $737.78 billion between April and September 2026; a separate RBI paper puts import cover at about 10 months as of 13 November. But net foreign direct investment turned negative in September, with an outflow of $4.9 billion, Business Standard reports. Since end-March, RBI's net dollar purchases total $54.37 billion, building the buffer it can use against oil and tariff shocks.", "metrics": ["Reserves $737.78B", "~10 months import cover", "Net FDI −$4.9B (Sep)"], "why": "A large buffer lets RBI defend the rupee, but negative net FDI shows long-term investors pulling back just as tariff risk rises.", "src": [{"t": "CrackTarget: Current affairs, 26 Nov", "u": "https://cracktarget.com/current-affairs-26-november-2026/"}, {"t": "Business Standard: RBI paper on inflation", "u": "https://www.business-standard.com/economy/news/inflation-more-generalised-more-categories-seeing-price-hikes-rbi-paper-126112600055_1.html"}, {"t": "Shoonya: RBI November bulletin", "u": "https://shoonya.com/blog/what-the-rbis-november-bulletin-says-about-indias-economy/"}]}, {"cat": "India", "title": "Cabinet clears ₹11,000 crore construction-equipment scheme, Silchar airport and a Chennai port terminal", "brief": "The Union Cabinet on 25 November approved an eight-year, ₹11,000 crore scheme to boost construction and infrastructure equipment manufacturing; the market of about ₹97,500 crore in FY25 is projected to reach ₹2,28,100 crore by FY30. It also cleared a ₹2,014 crore greenfield airport at Doloo, Silchar, with a 2,705 m runway, and a ₹4,288 crore second container terminal at Kamarajar Port in Tamil Nadu with 2 million TEU capacity, built under PPP.", "metrics": ["CIE scheme ₹11,000 cr", "Silchar airport ₹2,014 cr", "Kamarajar 2M TEU, ₹4,288 cr"], "why": "Incentives cut import dependence for earthmovers and cranes, lifting makers such as Action Construction Equipment, while new port capacity lowers logistics costs.", "src": [{"t": "CrackTarget: Current affairs, 26 Nov", "u": "https://cracktarget.com/current-affairs-26-november-2026/"}, {"t": "Kotak Neo: Closing Bell, 26 Nov", "u": "https://www.kotakneo.com/news/market-news/sensex-and-nifty-manage-to-close-higher-despite-paring-early-gains/"}]}, {"cat": "India", "title": "Six new urea plants worth ₹54,000 crore planned to cut fertiliser imports", "brief": "Under the New Investment Policy for Urea 2026, six brownfield urea plants worth about ₹54,000 crore, each of 12.7 lakh tonnes a year, are planned at Chennai (MFL), Nangal (NFL), Shahjahanpur and Jagdishpur in Uttar Pradesh, Panagarh in West Bengal and Gadepan in Rajasthan. India uses about 400 lakh tonnes of urea a year, while domestic output rose from 225 lakh tonnes in 2014-15 to a record 314.07 lakh tonnes in 2023-24.", "metrics": ["6 plants, ~₹54,000 cr", "12.7 LMT each", "Demand ~400 LMT/yr"], "why": "Adding about 76 lakh tonnes of capacity would narrow the import gap while Gulf routes for fertiliser and gas remain disrupted.", "src": [{"t": "CrackTarget: Current affairs, 26 Nov", "u": "https://cracktarget.com/current-affairs-26-november-2026/"}]}, {"cat": "Business", "title": "Flipkart CEO Kalyan Krishnamurthy quits after 11 years, with its IPO still in limbo", "brief": "Kalyan Krishnamurthy is stepping down as Flipkart CEO, with 4 December his last day, according to an internal letter from Walmart International chief Chris Nicholas; a successor will be named in the coming weeks, with CPTO Balaji Thiagarajan and the board leading meanwhile. He helped raise about $30 billion and steered Walmart's 2018 deal at over $20 billion. Flipkart's revenue rose 18% to ₹1.45 trillion in the year to March 2026, with a net loss of ₹8,468 crore.", "metrics": ["Last day 4 Dec", "FY26 revenue ₹1.45T (+18%)", "Net loss ₹8,468 cr"], "why": "A leadership change before a long-awaited IPO adds uncertainty for employees seeking ESOP liquidity and for India's e-commerce valuations.", "src": [{"t": "Business Standard: Flipkart CEO steps down", "u": "https://www.business-standard.com/companies/news/kalyan-krishnamurthy-exit-flipkart-ceo-ipo-esop-walmart-126112500495_1.html"}]}, {"cat": "Business", "title": "US shoppers spent $82.5 billion online before Thanksgiving; AI-referred traffic up 127%", "brief": "Adobe Analytics says US consumers spent $82.5 billion online from 1 to 22 November, up 9.1%, with two days topping $4 billion for the first time before Thanksgiving. It forecasts $47.5 billion for the five days from Thanksgiving to Cyber Monday (+7.4%), including $12.9 billion on Black Friday and $15.1 billion on Cyber Monday. Visits to retail sites referred by AI tools are up 127%. Salesforce expects $357 billion of global Cyber Week sales.", "metrics": ["$82.5B (+9.1%)", "Black Friday $12.9B", "Cyber Monday $15.1B", "AI referrals +127%"], "why": "AI assistants are becoming a real shopping channel, shifting marketing budgets from search ads toward being visible to AI agents.", "src": [{"t": "Digital Commerce 360: Adobe holiday data", "u": "https://www.digitalcommerce360.com/2026/11/25/adobe-online-holiday-spending-data/"}]}, {"cat": "Business", "title": "Poundland collapses into administration, putting 11,000 jobs and 600 stores at risk", "brief": "UK discount chain Poundland entered administration on Wednesday with AlixPartners appointed, putting about 11,000 jobs and 600 stores at risk. Its owner Gordon Brothers took control in June last year, buying it from Pepco Group for £1 and providing £85 million of financing, and had targeted £100 million of savings. Stores will keep trading while administrators look for a buyer. The shopworkers' union Usdaw accused the owner of failing to engage, weeks before Christmas.", "metrics": ["~11,000 jobs", "600 stores", "Bought for £1 in 2025"], "why": "Discount-retail failures show how costs and weak demand are squeezing UK high streets, a warning for suppliers, landlords and lenders.", "src": [{"t": "Euronews: Poundland enters administration", "u": "https://www.euronews.com/2026/11/26/uk-discounter-poundland-enters-administration-with-11000-jobs-at-risk"}]}, {"cat": "Business", "title": "Microsoft lines up grid power for three Wyoming data centres", "brief": "Utility Cheyenne Light filed grid agreements with US regulator FERC on 24 November to serve three Microsoft data centres in Wyoming, with Microsoft paying an upfront contribution toward construction. Cheyenne Light serves about 46,000 retail customers and hit a system peak of 439 MW in July 2026, so the new load is large relative to its system. Regulators are expected to rule on cost recovery by mid-2027.", "metrics": ["3 data centres", "Utility peak 439 MW", "Ruling by mid-2027"], "why": "Hyperscalers paying for grid upgrades up front is becoming the model for securing power while keeping regulators and households onside.", "src": [{"t": "Rio Rundown: AI news, 26 Nov", "u": "https://riorundown.substack.com/p/ai-news-nov-26-2026-agentic-ai-infrastructure"}]}, {"cat": "Energy", "title": "Brent eases to about $94 as traders weigh Hormuz threats against a coming glut", "brief": "Brent fell 82 cents (0.87%) to $93.79 a barrel by 09:39 GMT on Thursday and WTI to $83.33, after Wednesday's 3.5% jump to $94.61; there is no WTI settlement because of the US holiday. US crude stocks rose 1.1 million barrels to 418.9 million last week. PVM's Tamas Varga sees a new range of about $88–97, with surplus supply and rate hikes capping prices; Kotak sees $87–98 and warns a sustained move above $100 would pressure the rupee.", "metrics": ["Brent $93.79 (−0.87%)", "WTI $83.33", "US stocks 418.9M bbl", "Range $88–97 (PVM)"], "why": "Crude near $94 keeps India's import bill and inflation high; whether $100 holds as a ceiling decides the rupee and oil-marketing margins.", "src": [{"t": "Reuters via Business Recorder: Oil prices fall", "u": "https://www.brecorder.com/news/40450825/oil-prices-fall-as-supply-concerns-linger-after-iran-claims-mine-strikes-on-ships"}, {"t": "Kotak Neo: Brent near $95 ahead of OPEC+", "u": "https://www.kotakneo.com/news/commodities/brent-crude-oil-prices-middle-east-tensions-opec-meeting-2026/"}]}, {"cat": "Energy", "title": "OPEC+ meets Sunday to set 2027 output, its first big decision without the UAE", "brief": "OPEC+ ministers meet on 29 November to decide production policy for 2027. Reuters says the group must balance output now that the UAE is no longer a member, while Iraq and Kazakhstan are pressing for higher estimates of their production capacity, which would raise their quotas. The IEA forecasts a supply surplus in the fourth quarter, and Brent has fallen about 13.5% over the past month, Kotak notes.", "metrics": ["Meeting 29 Nov", "2027 quotas", "UAE no longer a member"], "why": "Higher quotas for Iraq and Kazakhstan would add supply and ease prices for importers like India, but weaken OPEC+'s grip on the market.", "src": [{"t": "Reuters via Business Recorder: Oil prices fall", "u": "https://www.brecorder.com/news/40450825/oil-prices-fall-as-supply-concerns-linger-after-iran-claims-mine-strikes-on-ships"}, {"t": "Kotak Neo: Brent near $95 ahead of OPEC+", "u": "https://www.kotakneo.com/news/commodities/brent-crude-oil-prices-middle-east-tensions-opec-meeting-2026/"}]}, {"cat": "Energy", "title": "Ukrainian drones have cut Russian refining by about 45% since late October", "brief": "Russian refinery processing is down about 45% since late October, Reuters reports citing industry data, as Ukrainian drones keep hitting energy sites. Overnight targets included the Kuibyshev refinery in Samara, which caught fire again, the Transneft pipeline station at Subkhankulovo in Bashkortostan, and EuroChem's Nevinnomyssk Azot plant, which makes about 1.42 million tonnes of ammonium nitrate and 1.16 million tonnes of ammonia a year, along with the power station next to it.", "metrics": ["Refining −45% since late Oct", "Nevinnomyssk: 1.42 Mt AN/yr"], "why": "Lower Russian refining tightens global diesel and fertiliser supply and may push Russia to export more crude, which affects India's discounted oil purchases.", "src": [{"t": "Ukraine Daily, 26 Nov", "u": "https://thechrissampson.substack.com/p/ukraine-daily-november-26-2026-kyiv"}, {"t": "Euronews: Russian missile and drone barrage", "u": "https://www.euronews.com/2026/11/26/russia-launches-ballistic-missile-and-drone-barrage-on-ukraine-killing-at-least-three"}]}, {"cat": "Energy", "title": "Ukraine's power and gas hit again; Zaporizhzhia nuclear plant loses power for the 17th time", "brief": "A Russian attack on 25 November severely damaged a DTEK thermal power station, which stopped generating, the company's third large-scale hit on its thermal fleet this month. A fire halted a Naftogaz gas production site in Poltava region, and the Zaporizhzhia nuclear plant lost external power for the 17th time in 2026, by Reuters' count. In Mykolaiv region 85 settlements lost power, and Ukrenergo scheduled rolling outages and industrial limits for Thursday.", "metrics": ["ZNPP outage no. 17 in 2026", "85 settlements dark", "DTEK: 3rd big hit in Nov"], "why": "Winter damage to Ukraine's grid and gas output raises its import needs from Europe, adding to regional gas demand and prices.", "src": [{"t": "Ukraine Daily, 26 Nov", "u": "https://thechrissampson.substack.com/p/ukraine-daily-november-26-2026-kyiv"}, {"t": "LB.ua: Overnight Russian strikes", "u": "https://en.lb.ua/news/2026/11/26/51574_overnight_russian_strikes_hit.html"}]}, {"cat": "Climate & Health", "title": "Congo's Ebola outbreak passes 12,000 cases, the fastest-growing on record", "brief": "Congo's health ministry said on Thursday that 12,021 people have been confirmed with Ebola and nearly half have died, making it the fastest-growing outbreak on record and the deadliest of the country's 17. Declared in May, it is caused by the Bundibugyo virus, for which there is no approved vaccine or treatment. Fighting resumed near Bunia in Ituri province, and WHO says clashes have stopped teams reaching some communities.", "metrics": ["12,021 confirmed", "~half have died", "No approved vaccine"], "why": "The outbreak is on track to pass West Africa's 2014–16 toll of 11,000 deaths; conflict near mining towns hampers the response and raises risks for regional trade.", "src": [{"t": "Euronews/AP: Ebola cases pass 12,000", "u": "https://www.euronews.com/2026/11/26/ebola-cases-in-congo-surpass-12000-in-fastest-growing-outbreak"}]}, {"cat": "Climate & Health", "title": "Climate TRACE: India's emissions rose 4% in September while China's and America's fell", "brief": "Climate TRACE data released on 26 November put global greenhouse-gas emissions at 4.7 billion tonnes of CO2-equivalent in September, roughly flat on a year earlier, and 42.9 billion tonnes for the year to date, slightly lower. India's emissions rose 14 million tonnes, or 4.0%, while China's fell 0.6% and the United States' 0.8%. Power remained the biggest sector at 1,306.6 million tonnes, up 0.6%, while transport fell 1.1%.", "metrics": ["Global Sep 4.7 GtCO2e", "India +4.0%", "China −0.6%", "Transport −1.1%"], "why": "India is the fastest-growing big emitter in the data, which will shape carbon-border costs and green-finance terms for Indian exporters.", "src": [{"t": "Cyprus Shipping News: Climate TRACE September data", "u": "https://cyprusshippingnews.com/2026/11/26/climate-trace-releases-september-2026-emissions-data/"}]}, {"cat": "Climate & Health", "title": "Australia's emissions fall 1.3% but stay off track for its 2035 target", "brief": "Australia's emissions fell 1.3%, or 6.2 million tonnes, in the year to June 2026, the annual climate statement shows. The Climate Change Authority says meeting the 2030 and 2035 targets (cuts of 43% and 62–70%) needs average reductions of about 25–30 million tonnes a year. Electricity emissions fell 3.6% as renewables supplied a record 45.9% of the main grid, but transport rose 0.1%; EVs are close to a quarter of new car sales.", "metrics": ["−1.3% (6.2 Mt)", "Renewables 45.9%", "Needed: 25–30 Mt/yr"], "why": "Fast renewable growth that still misses targets shows transport and industry are the hard part, the same challenge India faces on its net-zero path.", "src": [{"t": "ABC News: Australia's emissions fall", "u": "https://www.abc.net.au/news/2026-11-26/australia-emissions-fall-short-2035-climate-target/107418552"}]}, {"cat": "Sports", "title": "Italy beat South Korea 2-1 without Sinner to reach the Davis Cup semi-finals", "brief": "Holders Italy survived a scare in Bologna on Wednesday. Lorenzo Musetti beat Hong Seong-chan 6-0, 7-6(5), but world No. 139 Kwon Soon-woo stunned seventh-ranked Flavio Cobolli 3-6, 7-6(3), 7-6(5). Matteo Berrettini and Andrea Vavassori then won the deciding doubles 7-6(2), 7-6(11), with the Koreans missing four set points in the second-set tie-break. Italy, without the injured Jannik Sinner, face the Czech Republic in Friday's semi-final.", "metrics": ["Italy 2-1 South Korea", "Doubles 7-6, 7-6(11)", "SF v Czechia, Fri 27 Nov"], "why": "Italy's run toward a fourth straight title keeps the Bologna finals commercially strong for hosts, sponsors and broadcasters even without their biggest star.", "src": [{"t": "Field Level Media: Italy reach Davis Cup semis", "u": "https://fieldlevelmedia.com/atp-tour/italy-turns-back-challenge-from-south-korea-reaches-davis-cup-semis/"}, {"t": "Bluewin: Italy beat South Korea", "u": "https://www.bluewin.ch/en/sport/defending-champion-italy-defeats-south-korea-and-advances-to-the-semifinals-once-again-li.3687524"}]}, {"cat": "Sports", "title": "Czechs sweep Canada; Zverev levels Germany's tie with Britain", "brief": "The Czech Republic beat Canada 2-0 in the first quarter-final: Tomas Machac defeated Liam Draxl 6-2, 3-6, 6-2 and Jiri Lehecka beat Felix Auger-Aliassime 7-6(4), 6-2. On Thursday, world No. 1 Alexander Zverev beat Arthur Fery in straight sets to level Germany's tie with Great Britain at 1-1, sending it to a deciding doubles. Austria play Spain later on Thursday, the semi-finals are on Friday and Saturday, and the final is on Sunday 29 November.", "metrics": ["CZE 2-0 CAN", "GER 1-1 GBR, to doubles", "Final 29 Nov"], "why": "The eight-team, one-week Bologna format packs the Davis Cup into a single TV window, the model the event now sells to sponsors.", "src": [{"t": "Yahoo Sports: Davis Cup quarter-finals", "u": "https://sports.yahoo.com/tennis/articles/davis-cup-finals-2026-quarter-112819231.html"}, {"t": "The Brief: Zverev levels tie 1-1", "u": "https://www.thebrief.news/en/standard/article/47684/zverev-beats-fery-to-level-germany-v-great-britain-davis-cup-tie-at-1-1"}, {"t": "Bluewin: Italy beat South Korea", "u": "https://www.bluewin.ch/en/sport/defending-champion-italy-defeats-south-korea-and-advances-to-the-semifinals-once-again-li.3687524"}]}, {"cat": "Sports", "title": "South Africa whitewash Bangladesh 2-0 as Mulder stars and Ackerman hits 150", "brief": "South Africa completed a 2-0 series sweep at Centurion, with Wiaan Mulder's seven wickets leading the win, Cricinfo reports. Bangladesh were bowled out for 91 in the first innings; South Africa replied with 494 for 7, a 403-run lead, built on Marques Ackerman's 150 off 138 balls, the fastest Test 150 by a South African, and Mulder's fifth Test century. South Africa had won the first Test in Johannesburg by nine wickets.", "metrics": ["Series 2-0", "BAN 91 all out", "Ackerman 150 (138 balls)", "Mulder 100 + 7 wkts"], "why": "A clean sweep adds World Test Championship points for South Africa, tightening the race that India and New Zealand are also in.", "src": [{"t": "ESPNcricinfo: SA v BAN 2nd Test report", "u": "https://www.cricinfo.com/series/bangladesh-in-south-africa-2026-27-1525637/south-africa-vs-bangladesh-2nd-test-1525663/match-report"}, {"t": "Prothom Alo/AFP: Ackerman's 150", "u": "https://en.prothomalo.com/sports/cricket/vxhp53l38x"}]}, {"cat": "Sports", "title": "England level the T20I series in Australia with an eight-wicket win", "brief": "England beat Australia by eight wickets with 41 balls to spare in the second T20I on 24 November, levelling the series 1-1 after Australia won the first by three wickets with one ball left. England had already taken the ODI series 2-1, sealed by a 97-run win in the third match built on Ben Duckett's century and four wickets for Baker, after losing the opener by seven wickets.", "metrics": ["ENG won by 8 wkts", "T20I series 1-1", "ODIs: ENG 2-1"], "why": "England's strong white-ball form in Australia lifts interest, and broadcast value, for the rest of the tour.", "src": [{"t": "ESPNcricinfo: AUS v ENG 2nd T20I", "u": "https://www.cricinfo.com/series/england-in-australia-2026-27-1528677/australia-vs-england-2nd-t20i-1528707/live-cricket-score"}, {"t": "ESPNcricinfo: AUS v ENG 1st T20I", "u": "https://www.cricinfo.com/series/england-in-australia-2026-27-1528677/australia-vs-england-1st-t20i-1528706/live-cricket-score"}, {"t": "ESPNcricinfo: AUS v ENG 3rd ODI report", "u": "https://www.cricinfo.com/series/england-in-australia-2026-27-1528677/australia-vs-england-3rd-odi-1528705/match-report"}]}, {"cat": "Sports", "title": "NBA Cup: Knicks storm back past Cleveland; Timberwolves win at Oklahoma City", "brief": "The Knicks beat Cleveland 121-102 at Madison Square Garden, outscoring the Cavaliers 39-17 in the fourth quarter; Jose Alvarado scored a season-high 21 off the bench and Jalen Brunson 19 while ill, against Donovan Mitchell's 30. Minnesota won 113-106 at Oklahoma City behind Jaden McDaniels' 32 points and 10 rebounds, despite 32 from Shai Gilgeous-Alexander. The Wolves are 14-5 and 3-0 in Cup play; the Knicks have won six straight.", "metrics": ["NYK 121-102 CLE", "MIN 113-106 OKC", "MIN 14-5, Cup 3-0"], "why": "The in-season NBA Cup is the league's bid to add stakes and ad value to November games, and tight group races help ratings.", "src": [{"t": "ESPN/AP: Knicks 121-102 Cavaliers", "u": "https://www.espn.com/nba/recap/_/gameId/401909319"}, {"t": "ESPN/AP: Timberwolves 113-106 Thunder", "u": "https://www.espn.com/nba/recap?gameId=401909320"}]}, {"cat": "Sports", "title": "India and New Zealand play a Test series decider in Christchurch from Friday", "brief": "The second and final Test between New Zealand and India starts at Hagley Oval, Christchurch, on Friday 27 November at 3:30 AM IST, with the series level after a draw in Wellington. The winner takes the series and gains in the World Test Championship race. India have played one Test at Hagley Oval, losing in February 2020. Shubman Gill captains and changes are expected to the pace attack, led by Jasprit Bumrah. India lead the head-to-head 22-16 in 66 Tests.", "metrics": ["Starts 27 Nov, 3:30 AM IST", "Series level after draw", "H2H: IND 22, NZ 16, 28 drawn"], "why": "A series win would strengthen India's World Test Championship final hopes, which drive broadcast and sponsorship value for Indian cricket.", "src": [{"t": "CricTracker: NZ v IND 2nd Test preview", "u": "https://www.crictracker.com/cricket-previews/new-zealand-vs-india-2026-2nd-test-preview/"}]}, {"cat": "Sports", "title": "F1 heads to Qatar: Verstappen needs 12 points to secure second behind Antonelli", "brief": "Before this weekend's Qatar Grand Prix, Mercedes' Kimi Antonelli leads the drivers' standings with 402 points. Max Verstappen, who won in Las Vegas and four of the last six races, is second on 304, 37 ahead of Lewis Hamilton and 40 ahead of George Russell and Lando Norris, with 50 points left this season. He needs 12 points in Qatar to make second place certain. In the constructors' race, Red Bull lead McLaren by nine points for third.", "metrics": ["Antonelli 402", "Verstappen 304", "50 pts left", "Red Bull +9 on McLaren"], "why": "Constructors' positions decide each team's share of prize money, so third place is worth millions to Red Bull or McLaren.", "src": [{"t": "GPblog: Verstappen's Qatar maths", "u": "https://www.gpblog.com/en/news/verstappen-can-deny-mercedes-and-russell-their-only-remaining-goal-for-2026"}]}]}</script>
<script>
{
  const E = JSON.parse(document.getElementById('edition').textContent);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const shades = ['#1240e0','#0b0d12','#4f74ff','#7f8aa3','#9db2ff','#2a3350','#c9d4ff','#56607a'];
  const cats = E.order.filter(c => E.items.some(i => i.cat === c));
  const count = c => E.items.filter(i => i.cat === c).length;
  const slug = c => c.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  document.getElementById('dateline').textContent = E.date;
  document.getElementById('lede').textContent = E.lede;
  document.getElementById('note').textContent = E.note || '';
  document.title = 'The Daily 50 · ' + E.short;
  document.getElementById('bar').innerHTML = cats.map((c, k) =>
    `<span style="width:${count(c) / E.items.length * 100}%;background:${shades[k % shades.length]}" title="${esc(c)}: ${count(c)}"></span>`).join('');
  document.getElementById('legend').innerHTML = cats.map((c, k) =>
    `<li><i style="background:${shades[k % shades.length]}"></i>${esc(c)} <b>${count(c)}</b></li>`).join('');
  document.getElementById('nav').innerHTML = cats.map(c => `<a href="#${slug(c)}">${esc(c)} · ${count(c)}</a>`).join('');
  let n = 0;
  document.getElementById('main').innerHTML = cats.map(c => `
    <section id="${slug(c)}"><h2>${esc(c)} <small>${count(c)} events</small></h2>
    <div class="list">${E.items.filter(i => i.cat === c).map(i => {
      n++;
      const m = (i.metrics || []).length ? `<ul class="metrics">${i.metrics.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
      const s = (i.src || []).map(x => `<a href="${esc(x.u)}" rel="noopener">${esc(x.t)}</a>`).join('');
      return `<article><h3><span class="n">${n}</span><span>${esc(i.title)}</span></h3>
        <p>${esc(i.brief)}</p>${m}
        <p class="why"><b>Why it matters:</b> ${esc(i.why)}</p>
        <div class="src">Sources: ${s}</div></article>`;
    }).join('')}</div></section>`).join('');
  document.getElementById('foot').textContent = E.footer;
}
</script>
